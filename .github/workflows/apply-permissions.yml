name: Apply NRORA permissions model
on:
  push:
    branches: [main]

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply NRORA permissions model') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch application
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.jsx')
          s = app.read_text()
          s = s.replace('const ROLE_LABELS={ceo:"CEO",division_manager:"Division Manager",area_manager:"Area Manager",tl:"TL",staff:"Staff",telecaller:"Telecaller",mechanic:"Mechanic"};','const ROLE_LABELS={ceo:"CEO",admin:"Main Admin",division_manager:"Division Manager",area_manager:"Area Manager",tl:"TL",staff:"Staff",telecaller:"Telecaller",mechanic:"Mechanic"};\nconst PERMISSION_LABELS={dashboard_view:"Dashboard",requests_view:"View Requests",requests_create:"Create Requests",requests_manage:"Manage Requests",customers_view:"View Customers",customers_create:"Create Customers",customers_delete:"Delete Customers",payments_view:"View Payments",payments_manage:"Manage Payments",technicians_view:"View Technicians",technicians_manage:"Manage Technicians",employees_view:"View Employees",employees_create:"Create Employees",employees_manage:"Manage Employees",workorders_view:"View Work Orders",workorders_manage:"Manage Work Orders",settings_view:"View Settings"};\nconst canManagePermissions=r=>r==="ceo";')
          s = s.replace('function Layout({user,onLogout}){const[open,setOpen]=useState(false);const links=[["/",Home,"Dashboard"],["/requests",MapPin,"Requests"],["/customers",UserPlus,"Customers"],["/technicians",Users,"Technicians"],["/employees",UserCog,"Employees"],["/settings",Settings,"Settings"],["/contact",Map,"Contact"]];return','function Layout({user,onLogout}){const[open,setOpen]=useState(false);const[perms,setPerms]=useState({});useEffect(()=>{api("/permissions/me").then(r=>setPerms(r.permissions||{})).catch(()=>{})},[user.role]);const links=[["/",Home,"Dashboard","dashboard_view"],["/requests",MapPin,"Requests","requests_view"],["/customers",UserPlus,"Customers","customers_view"],["/technicians",Users,"Technicians","technicians_view"],["/employees",UserCog,"Employees","employees_view"],["/settings",Settings,"Settings","settings_view"],["/contact",Map,"Contact",null],["/permissions",ShieldCheck,"Permissions",null]];return')
          s = s.replace('<nav>{links.filter(x=>x[0]!=="/employees"||canManageEmployees(user.role)).map(([to,I,label])=>','<nav>{links.filter(x=>(x[0]!=="/employees"||canManageEmployees(user.role))&&(x[0]!=="/permissions"||canManagePermissions(user.role))&&(!x[3]||perms[x[3]])).map(([to,I,label])=>')
          s = s.replace('<Route path="/employees" element={canManageEmployees(user.role)?<Employees user={user}/>:<Navigate to="/" replace/>}/><Route path="/settings"','<Route path="/employees" element={canManageEmployees(user.role)?<Employees user={user}/>:<Navigate to="/" replace/>}/><Route path="/permissions" element={canManagePermissions(user.role)?<Permissions/>:<Navigate to="/" replace/>}/><Route path="/settings"')
          marker='function SettingsPage(){'
          component='''function Permissions(){const roles=["ceo","admin","division_manager","area_manager","tl","staff","telecaller","mechanic"];const[rows,setRows]=useState({}),[error,setError]=useState("");const load=()=>api("/permissions").then(r=>setRows(r.permissions||{})).catch(e=>setError(e.message));useEffect(load,[]);const toggle=async(role,permission,allowed)=>{setError("");setRows(x=>({...x,[role]:{...(x[role]||{}),[permission]:allowed}}));try{await api("/permissions",{method:"PATCH",body:JSON.stringify({role,permission,allowed})})}catch(e){setError(e.message);load()}};return <Page title="Permissions" sub="CEO controls what each role can access"><div className="card"><h2><ShieldCheck size={18}/> Role Permission Matrix</h2><p className="muted">Choose exactly which modules and actions each role can use. Changes apply to new requests immediately.</p>{error&&<p className="error">{error}</p>}<div style={{display:"grid",gap:18}}>{roles.map(role=><div key={role} className="card" style={{padding:16,border:"1px solid #dbe5f1"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><b style={{fontSize:17}}>{ROLE_LABELS[role]}</b><small className="muted">{Object.values(rows[role]||{}).filter(Boolean).length} permissions enabled</small></div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:8}}>{Object.entries(PERMISSION_LABELS).map(([key,label])=><label key={key} style={{display:"flex",alignItems:"center",gap:8,padding:9,border:"1px solid #e4ebf4",borderRadius:9}}><input type="checkbox" checked={Boolean(rows[role]?.[key])} disabled={role==="ceo"} onChange={e=>toggle(role,key,e.target.checked)}/><span>{label}</span></label>)}</div></div>)}</div></div></Page>}\n'''
          if marker not in s: raise SystemExit('SettingsPage marker not found')
          s=s.replace(marker,component+marker,1)
          app.write_text(s)

          server=Path('backend/src/server.js')
          s=server.read_text()
          marker='const staffRoles=["ceo","admin","division_manager","area_manager","tl","staff","telecaller","employee"];'
          code='''const PERMISSION_KEYS=["dashboard_view","requests_view","requests_create","requests_manage","customers_view","customers_create","customers_delete","payments_view","payments_manage","technicians_view","technicians_manage","employees_view","employees_create","employees_manage","workorders_view","workorders_manage","settings_view"];\nconst DEFAULT_PERMISSIONS={ceo:PERMISSION_KEYS,admin:["dashboard_view","requests_view","requests_create","requests_manage","customers_view","customers_create","customers_delete","payments_view","payments_manage","technicians_view","technicians_manage","employees_view","employees_create","employees_manage","workorders_view","workorders_manage","settings_view"],division_manager:["dashboard_view","requests_view","requests_create","requests_manage","customers_view","customers_create","payments_view","technicians_view","technicians_manage","employees_view","employees_create","employees_manage","workorders_view","workorders_manage","settings_view"],area_manager:["dashboard_view","requests_view","requests_create","requests_manage","customers_view","customers_create","payments_view","technicians_view","technicians_manage","employees_view","employees_create","workorders_view","workorders_manage"],tl:["dashboard_view","requests_view","requests_create","requests_manage","customers_view","customers_create","technicians_view","workorders_view","workorders_manage"],staff:["dashboard_view","requests_view","requests_create","customers_view","customers_create","technicians_view","workorders_view"],telecaller:["dashboard_view","requests_view","requests_create","customers_view","customers_create","payments_view","workorders_view"],mechanic:["dashboard_view","requests_view","technicians_view","workorders_view","workorders_manage"]};\nasync function ensurePermissionSchema(){await pool.query("create table if not exists role_permissions(role varchar(30) not null,permission varchar(60) not null,allowed boolean not null default false,primary key(role,permission))");for(const role of Object.keys(DEFAULT_PERMISSIONS)){for(const permission of PERMISSION_KEYS){await pool.query("insert into role_permissions(role,permission,allowed) values($1,$2,$3) on conflict(role,permission) do nothing",[role,permission,DEFAULT_PERMISSIONS[role].includes(permission)])}}}\nconst permissionAuth=permission=>(req,res,next)=>{const token=req.headers.authorization?.replace(/^Bearer\\s+/i,"");const user=token&&readToken(token);if(!user)return res.status(401).json({error:"Unauthorized"});pool.query("select allowed from role_permissions where role=$1 and permission=$2",[user.role,permission]).then(r=>{if(!r.rowCount||!r.rows[0].allowed)return res.status(403).json({error:`Permission denied: ${permission}`});req.user=user;next()}).catch(next)};\n'''
          if marker not in s: raise SystemExit('staffRoles marker not found')
          s=s.replace(marker,marker+'\n'+code,1)
          marker='async function ensureAdmin(){'
          endpoints='''app.get("/api/permissions/me",auth(),asyncRoute(async(req,res)=>{const r=await pool.query("select permission,allowed from role_permissions where role=$1",[req.user.role]);res.json({role:req.user.role,permissions:Object.fromEntries(r.rows.map(x=>[x.permission,x.allowed]))})}));\napp.get("/api/permissions",auth(["ceo"]),asyncRoute(async(_req,res)=>{const r=await pool.query("select role,permission,allowed from role_permissions order by role,permission");const out={};for(const row of r.rows){(out[row.role] ||= {})[row.permission]=row.allowed}res.json({permissions:out})}));\napp.patch("/api/permissions",auth(["ceo"]),asyncRoute(async(req,res)=>{const {role,permission,allowed}=req.body;if(!DEFAULT_PERMISSIONS[role]||!PERMISSION_KEYS.includes(permission))return res.status(400).json({error:"Invalid role or permission"});if(role==="ceo")return res.status(400).json({error:"CEO permissions are always enabled"});await pool.query("insert into role_permissions(role,permission,allowed) values($1,$2,$3) on conflict(role,permission) do update set allowed=excluded.allowed",[role,permission,Boolean(allowed)]);res.json({ok:true})}));\n'''
          if marker not in s: raise SystemExit('ensureAdmin marker not found')
          s=s.replace(marker,endpoints+marker,1)
          reps={'app.get("/api/dashboard", auth(),':'app.get("/api/dashboard", permissionAuth("dashboard_view"),','app.get("/api/customers",auth(),':'app.get("/api/customers",permissionAuth("customers_view"),','app.post("/api/customers",auth(staffRoles),':'app.post("/api/customers",permissionAuth("customers_create"),','app.delete("/api/customers/:id",auth(["ceo","admin"]),':'app.delete("/api/customers/:id",permissionAuth("customers_delete"),','app.get("/api/requests",auth(),':'app.get("/api/requests",permissionAuth("requests_view"),','app.post("/api/requests",auth(staffRoles),':'app.post("/api/requests",permissionAuth("requests_create"),','app.patch("/api/requests/:id",auth(staffRoles),':'app.patch("/api/requests/:id",permissionAuth("requests_manage"),','app.get("/api/mechanics",auth([':'app.get("/api/mechanics",permissionAuth("technicians_view"),','app.post("/api/mechanics",auth(["ceo","admin"]),':'app.post("/api/mechanics",permissionAuth("technicians_manage"),','app.patch("/api/mechanics",auth(["ceo","admin"]),':'app.patch("/api/mechanics",permissionAuth("technicians_manage"),','app.delete("/api/mechanics",auth(["ceo","admin"]),':'app.delete("/api/mechanics",permissionAuth("technicians_manage"),','app.get("/api/technicians",auth(),':'app.get("/api/technicians",permissionAuth("technicians_view"),','app.get("/api/work-orders",auth(staffRoles),':'app.get("/api/work-orders",permissionAuth("workorders_view"),','app.post("/api/work-orders",auth(staffRoles),':'app.post("/api/work-orders",permissionAuth("workorders_manage"),','app.get("/api/employees",auth(["ceo","admin","division_manager","area_manager","tl"]),':'app.get("/api/employees",permissionAuth("employees_view"),','app.post("/api/employees",auth(["ceo","admin","division_manager","area_manager","tl"]),':'app.post("/api/employees",permissionAuth("employees_create"),','app.patch("/api/employees/:id",auth(["ceo","admin","division_manager","area_manager","tl"]),':'app.patch("/api/employees/:id",permissionAuth("employees_manage"),'}
          for a,b in reps.items(): s=s.replace(a,b)
          s=s.replace('ensurePaymentSchema().then(ensureOperationsSchema).then(ensureAdmin).then(()=>app.listen','ensurePaymentSchema().then(ensureOperationsSchema).then(ensureAdmin).then(ensurePermissionSchema).then(()=>app.listen',1)
          server.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx backend/src/server.js .github/workflows/apply-permissions.yml
          git rm .github/workflows/apply-permissions.yml
          git commit -m "Apply NRORA permissions model"
          git push
