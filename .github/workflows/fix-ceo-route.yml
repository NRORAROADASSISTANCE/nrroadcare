name: Fix CEO operations route
on:
  push:
    paths-ignore:
      - '.github/workflows/fix-ceo-route.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply CEO route fix
        run: python scripts/patch_ceo_route.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/ceo.html scripts/patch_ceo_route.py
          if git diff --cached --quiet; then
            echo "No CEO route changes needed"
            exit 0
          fi
          git commit -m "Fix CEO operations login handoff"
          git push
