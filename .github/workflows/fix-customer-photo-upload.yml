name: Fix customer vehicle photo upload

on:
  push:
    paths-ignore:
      - '.github/workflows/fix-customer-photo-upload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer form
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/App.jsx')
          s=p.read_text(encoding='utf-8')
          start=s.index('function Customers({user}){')
          end=s.index('function Employees({user}){',start)
          new='''function Customers({user}){const navigate=useNavigate();const blank={name:"",phone:"",address:"",vehicle_no:"",photo1:"",photo2:""};const[rows,setRows]=useState([]),[f,setF]=useState(blank),[error,setError]=useState(""),[verificationId,setVerificationId]=useState(""),[otp,setOtp]=useState(""),[otpOpen,setOtpOpen]=useState(false),[busy,setBusy]=useState(false);const load=()=>api("/customers").then(setRows).catch(e=>setError(e.message));useEffect(load,[]);const imageToDataUrl=file=>new Promise((resolve,reject)=>{if(!file)return resolve("");const reader=new FileReader();reader.onerror=()=>reject(new Error("Unable to read image"));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("Invalid image"));img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",0.78))};img.src=reader.result};reader.readAsDataURL(file)});const choosePhoto=async(key,file)=>{if(!file)return;try{setError("");const data=await imageToDataUrl(file);setF(x=>({...x,[key]:data}))}catch(e){setError(e.message)}};const add=async e=>{e.preventDefault();setError("");setBusy(true);try{const r=await api("/customer-otp",{method:"POST",body:JSON.stringify({action:"send",name:f.name,phone:f.phone,address:f.address,vehicle_no:f.vehicle_no,vehicle_photos:[f.photo1,f.photo2].filter(Boolean)})});setVerificationId(r.verificationId);setOtp("");setOtpOpen(true)}catch(e){setError(e.message)}finally{setBusy(false)}};const verify=async e=>{e.preventDefault();setError("");setBusy(true);try{await api("/customer-otp",{method:"POST",body:JSON.stringify({action:"verify",verificationId,phone:f.phone,otp})});setOtpOpen(false);setVerificationId("");setF(blank);await load()}catch(e){setError(e.message)}finally{setBusy(false)}};const del=async id=>{if(!window.confirm("Delete this customer?"))return;setError("");try{await api(`/customers?id=${encodeURIComponent(id)}`,{method:"DELETE"});load()}catch(e){setError(e.message)}};const photoBox=(key,label)=><div><label>{label}<input type="file" accept="image/*" capture="environment" onChange={e=>choosePhoto(key,e.target.files?.[0])}/></label>{f[key]&&<div style={{marginTop:8}}><img src={f[key]} alt={label} style={{width:"100%",maxHeight:180,objectFit:"contain",borderRadius:10,border:"1px solid #d7e0ee"}}/><button className="danger" type="button" style={{marginTop:6}} onClick={()=>setF(x=>({...x,[key]:""}))}>Remove Photo</button></div>}</div>;return <Page title="Customers" sub="Customer records"><div className="cols"><form className="card form" onSubmit={add}><h2><Plus size={18}/> Add Customer</h2><p className="muted">OTP verification is mandatory. The customer account becomes active only after the mobile number is verified.</p><label>NAME<input required value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></label><label>MOBILE NUMBER<input required inputMode="numeric" pattern="[0-9]{10}" maxLength="10" placeholder="10-digit mobile number" value={f.phone} onChange={e=>setF({...f,phone:e.target.value.replace(/\\D/g,"")})}/></label><label>ADDRESS<input value={f.address} onChange={e=>setF({...f,address:e.target.value})}/></label><label>VEHICLE NUMBER<input required value={f.vehicle_no} onChange={e=>setF({...f,vehicle_no:e.target.value.toUpperCase()})}/></label>{photoBox("photo1","VEHICLE PHOTO 1")}{photoBox("photo2","VEHICLE PHOTO 2")}{error&&<p className="error">{error}</p>}<button className="primary" type="submit" disabled={busy}><ShieldCheck size={16}/> {busy?"Sending OTP…":"Save & Send Mobile OTP"}</button></form><div className="card"><h2>Customer List</h2>{rows.length===0?<p className="muted">No verified customers yet. Customer records appear here only after OTP verification.</p>:rows.map(c=><div className="row" key={c.id}><div><b>{c.name} {c.mobile_verified&&<span style={{fontSize:11,color:"#087f5b",fontWeight:800}}>✓ MOBILE VERIFIED</span>}</b><small>{c.phone} · {c.vehicle_no}</small><small>{c.address}</small><small>{c.account_status==="active"?"Account Active":"Account Inactive"}{Array.isArray(c.vehicle_photos)&&c.vehicle_photos.length?` · ${c.vehicle_photos.length} vehicle photo(s)`:""}</small></div><div style={{display:"flex",gap:8,alignItems:"center"}}><button className="primary" type="button" onClick={()=>navigate(`/payments?customer=${encodeURIComponent(c.id)}`)}>Pay ₹4,500</button>{user.role==="admin"&&<button className="danger" type="button" title="Delete customer" onClick={()=>del(c.id)}><Trash2 size={17}/></button>}</div></div>)}</div></div>{otpOpen&&<div style={{position:"fixed",inset:0,zIndex:100,background:"rgba(5,15,34,.65)",display:"grid",placeItems:"center",padding:20}}><form className="card form" onSubmit={verify} style={{width:"min(440px,100%)",boxShadow:"0 20px 60px rgba(0,0,0,.25)"}}><h2><CheckCircle size={20}/> Verify Customer Mobile</h2><p className="muted">OTP sent to <b>{f.phone}</b>. Enter the OTP received by the customer.</p><label>OTP<input required autoFocus inputMode="numeric" pattern="[0-9]{4,8}" maxLength="8" value={otp} onChange={e=>setOtp(e.target.value.replace(/\\D/g,""))}/></label>{error&&<p className="error">{error}</p>}<div style={{display:"flex",gap:8}}><button className="primary" type="submit" disabled={busy}>{busy?"Verifying…":"Verify & Activate Account"}</button><button className="danger" type="button" onClick={()=>{setOtpOpen(false);setVerificationId("");setOtp("")}}>Cancel</button></div></form></div>}</Page>}\n'''
          if 'type="file" accept="image/*"' not in s:
              p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx
          git rm .github/workflows/fix-customer-photo-upload.yml
          git commit -m "Add customer vehicle photo upload"
          git push
