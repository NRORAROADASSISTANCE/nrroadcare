name: Fix React effect runtime error

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix async effect callbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/App.jsx')
          s=p.read_text()
          s2=s.replace('useEffect(load,[])','useEffect(()=>{load();},[])')
          if s2==s:
              print('No effect callback replacements needed')
          else:
              p.write_text(s2)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix React async effect runtime error [skip ci]"
          git push
