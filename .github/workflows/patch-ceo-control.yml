name: Fix CEO control
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CEO access and roles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/App.jsx')
          s=p.read_text()
          s=s.replace('const ROLE_LABELS={division_manager:"Division Manager",area_manager:"Area Manager",tl:"TL",staff:"Staff",mechanic:"Mechanic"};','const ROLE_LABELS={ceo:"CEO",division_manager:"Division Manager",area_manager:"Area Manager",tl:"TL",staff:"Staff",telecaller:"Telecaller",mechanic:"Mechanic"};')
          s=s.replace('const canManageEmployees=r=>["admin","division_manager","area_manager","tl"].includes(r);','const canManageEmployees=r=>["ceo","admin","division_manager","area_manager","tl"].includes(r);')
          s=s.replace('user.role==="admin"?"Main Admin":ROLE_LABELS[user.role]||user.role','user.role==="ceo"?"CEO":user.role==="admin"?"Main Admin":ROLE_LABELS[user.role]||user.role')
          s=s.replace('const allowedRoles=user.role==="admin"?["division_manager","area_manager","tl","staff"]:user.role==="division_manager"?["area_manager","tl","staff"]:user.role==="area_manager"?["tl","staff"]:["staff"];','const allowedRoles=user.role==="ceo"?["admin","division_manager","area_manager","tl","staff","telecaller","mechanic"]:user.role==="admin"?["division_manager","area_manager","tl","staff"]:user.role==="division_manager"?["area_manager","tl","staff"]:user.role==="area_manager"?["tl","staff"]:["staff"];')
          p.write_text(s)

          p=Path('frontend/api/[...path].js')
          s=p.read_text()
          s=s.replace('const ROLES=["ceo","admin","division_manager","area_manager","tl","staff","customer","mechanic"];','const ROLES=["ceo","admin","division_manager","area_manager","tl","staff","telecaller","customer","mechanic"];')
          old='if(role==="admin")return json(res,403,{error:"Only the CEO can create an Admin"});if(!ROLES.includes(role)||role==="customer"||role==="mechanic"||role==="ceo")return json(res,400,{error:"Invalid staff role"});const allowed=u.role==="ceo"?["division_manager","area_manager","tl","staff"]:u.role==="admin"?["division_manager","area_manager","tl","staff"]:u.role==="division_manager"?["area_manager","tl","staff"]:u.role==="area_manager"?["tl","staff"]:["staff"];'
          new='if(role==="admin"){if(u.role!=="ceo")return json(res,403,{error:"Only the CEO can create an Admin"});const existing=await pool.query("select id from users where username=$1",[username]);if(existing.rowCount)return json(res,409,{error:"Username already exists"});const r=await pool.query("insert into users(username,password_hash,role,name,phone) values($1,$2,\'admin\',$3,$4) returning id,username,role,name,phone,active",[username,hash(password),name,phone]);return json(res,201,r.rows[0])}if(!ROLES.includes(role)||role==="customer"||role==="ceo")return json(res,400,{error:"Invalid employee role"});const allowed=u.role==="ceo"?["division_manager","area_manager","tl","staff","telecaller","mechanic"]:u.role==="admin"?["division_manager","area_manager","tl","staff"]:u.role==="division_manager"?["area_manager","tl","staff"]:u.role==="area_manager"?["tl","staff"]:["staff"];'
          if old not in s: raise SystemExit('employee role block not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('frontend/public/ceo.html')
          s=p.read_text()
          marker='<section class="card"><h2>🏢 Current Organization Structure</h2>'
          section='''<section class="card"><h2>👥 Create Employee / Role</h2><p class="sub">CEO can create every employee role. Admin can only be created by CEO.</p><form id="employeeForm"><div class="grid"><div><label>NAME<input id="empName" required></label><label>USERNAME<input id="empUsername" required autocomplete="off"></label><label>PASSWORD<input id="empPassword" type="password" minlength="6" required autocomplete="new-password"></label></div><div><label>ROLE<select id="empRole"><option value="admin">Admin</option><option value="division_manager">Division Manager</option><option value="area_manager">Area Manager</option><option value="tl">TL</option><option value="staff">Staff</option><option value="telecaller">Telecaller</option><option value="mechanic">Mechanic</option></select></label><label>MOBILE<input id="empPhone"></label></div></div><button class="btn">Create Employee</button></form></section>'''
          if marker not in s: raise SystemExit('CEO structure marker not found')
          s=s.replace(marker,section+marker,1)
          marker2="document.getElementById('adminForm').onsubmit=async e=>"
          js="document.getElementById('employeeForm').onsubmit=async e=>{e.preventDefault();try{const role=empRole.value;const body={name:empName.value,username:empUsername.value,password:empPassword.value,phone:empPhone.value};if(role==='admin'){await api('/ceo/admins',{method:'POST',body:JSON.stringify(body)})}else{await api('/employees',{method:'POST',body:JSON.stringify({...body,role})})}e.target.reset();msg(roleLabels[role]+' created successfully.',true);load()}catch(e){msg(e.message)}};"
          if marker2 not in s: raise SystemExit('CEO admin form marker not found')
          s=s.replace(marker2,js+marker2,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/api/'[...path].js' frontend/public/ceo.html
          git commit -m "Apply CEO control and employee role fixes" || true
          git rm .github/workflows/patch-ceo-control.yml
          git commit -m "Remove one-time CEO patch workflow" || true
          git push