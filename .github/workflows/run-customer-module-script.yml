name: Run NRORA customer module patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_customer_module.py
      - name: Validate backend
        run: node --check backend/src/server.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/server.js frontend/src/App.jsx frontend/src/styles.css frontend/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve NRORA customer management [skip ci]"
          git push origin main
