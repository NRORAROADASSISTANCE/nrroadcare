<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact NRORA</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#020b1b;color:#fff}
    .contact-section{min-height:306px;background:#0b2448;padding:36px 4%;}
    h1{margin:0 0 12px;font-size:36px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
    .contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1180px}
    .contact-card{min-height:146px;background:#fff;color:#101010;border-radius:20px;padding:40px 24px 20px;box-shadow:0 12px 28px rgba(0,0,0,.12);display:flex;flex-direction:column;justify-content:flex-start}
    .contact-card h2{font-size:18px;line-height:1.2;margin:0 0 18px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
    .contact-card p,.contact-card a{font-size:16px;line-height:1.3;margin:0;color:#303030;text-decoration:underline;text-underline-offset:2px;word-break:break-word}
    .contact-card a:hover{color:#0b4fa8}
    .bottom-strip{height:78px;background:#020b1b}
    @media(max-width:800px){
      .contact-section{padding:28px 18px;min-height:auto}
      h1{font-size:30px}
      .contact-grid{grid-template-columns:1fr}
      .contact-card{min-height:130px;padding:28px 20px 20px}
      .bottom-strip{height:38px}
    }
  </style>
</head>
<body>
  <section class="contact-section" aria-label="Contact NRORA">
    <h1>Contact NRORA</h1>
    <div class="contact-grid">
      <article class="contact-card">
        <h2>📞 <span>Phone</span></h2>
        <a href="tel:9160264439">9160264439</a>
      </article>
      <article class="contact-card">
        <h2>🌐 <span>Website</span></h2>
        <a href="https://nrroadcare.in" target="_blank" rel="noopener noreferrer">nrroadcare.in</a>
      </article>
      <article class="contact-card">
        <h2>📍 <span>Service Network</span></h2>
        <p>Telangana</p>
      </article>
    </div>
  </section>
  <div class="bottom-strip"></div>
</body>
</html>
