<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA Customer Registration</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#0b2a4a}.wrap{max-width:620px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 35px #1233;border:1px solid #d8e3f0}h1{margin:0 0 6px}.muted{color:#667085}.field{margin:14px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd8e8;border-radius:9px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#1264e8;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.status{margin-top:16px;padding:13px;border-radius:9px;background:#edf5ff}.error{color:#b42318;background:#fff0f0}.success{color:#087f5b;background:#ecfdf3}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><h1>NRORA Customer Registration</h1><p class="muted">Register for yearly NRORA Road Assistance membership.</p><p class="small"><b>₹4,500 / year</b> · No OTP required at registration for now. Account activates only after successful payment and the 10-minute bank/gateway verification.</p><form id="form"><div class="field"><label>NAME *</label><input id="name" required maxlength="120"></div><div class="field"><label>MOBILE NUMBER *</label><input id="phone" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="10-digit mobile number"></div><div class="field"><label>ADDRESS</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>VEHICLE NUMBER *</label><input id="vehicle" required maxlength="30" placeholder="TS.. / AP.."></div><div class="field"><label>VEHICLE PHOTOS (optional)</label><div class="photos"><input id="photo1" type="file" accept="image/*" capture="environment"><input id="photo2" type="file" accept="image/*" capture="environment"></div></div><button id="pay" type="submit">Register & Pay ₹4,500</button></form><div id="status" class="status hidden"></div></div></div><script>const $=id=>document.getElementById(id);const status=(m,c='status')=>{$('status').className='status '+c;$('status').textContent=m};const photo=f=>new Promise((res,rej)=>{if(!f)return res('');const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});let orderId='';$('form').addEventListener('submit',async e=>{e.preventDefault();$('pay').disabled=true;status('Creating customer account and payment…');try{const photos=[await photo($('photo1').files[0]),await photo($('photo2').files[0])].filter(Boolean);const r=await fetch('/api/customer-register?action=register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),vehicle_no:$('vehicle').value.trim(),vehicle_photos:photos})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Registration failed');orderId=d.orderId;const rz=new Razorpay({key:d.keyId,amount:d.amount,currency:d.currency,name:'NRORA',description:'Yearly Road Assistance Membership',order_id:d.orderId,prefill:{name:$('name').value.trim(),contact:$('phone').value.trim()},theme:{color:'#1264e8'},handler:async p=>{status('Payment successful. Starting bank/gateway verification…');const vr=await fetch('/api/customer-register?action=verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const vd=await vr.json();if(!vr.ok)throw new Error(vd.error||'Payment verification failed');poll()}});rz.on('payment.failed',x=>{status('Payment failed. You can try again.','error');$('pay').disabled=false});rz.open()}catch(x){status(x.message||'Unable to continue','error');$('pay').disabled=false}});async function poll(){for(let i=0;i<25;i++){await new Promise(r=>setTimeout(r,24000));const r=await fetch('/api/customer-register?action=status&order_id='+encodeURIComponent(orderId));const d=await r.json();if(d.status==='active'){status('Payment confirmed. Your NRORA customer account is ACTIVE. Receipt: '+d.receiptNo+' · Renewal: '+d.renewalDate,'success');return}status('Payment received. Bank/gateway verification is in progress. Please wait up to 10 minutes…')}status('Verification is still in progress. Please revisit this page later with your payment reference.')}</script></body></html>
