<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NRORA</title><style>html,body,#root{min-height:100%;margin:0}body{min-width:320px}</style></head><body><script>/* Public customer self-registration must never fall through to the staff/admin SPA. */(function(){var p=location.pathname.replace(/\/+$/,'')||'/';if(p==='/register'||p==='/customer-register'){location.replace('/customer-register.html'+location.search);return}})();if(!location.hash&&location.pathname==='/'){location.replace('/public-site.html#home')}</script><div id="root"></div><script>/* CEO session bridge: if a CEO session exists, it always wins over any stale Admin token. */(function(){const t=localStorage.getItem('nrora_ceo_token');if(t)localStorage.setItem('nrora_token',t)})();</script><script>(function(){const KEY='nrora_role_labels';const labels={staff:'Executive',tellicallor:'Tellicallor',receptionist:'Receptionist'};const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}};const save=(x)=>localStorage.setItem(KEY,JSON.stringify({...get(),...x}));function enhance(){document.querySelectorAll('select').forEach(s=>{if(!s.querySelector('option[value="tellicallor"]')){const t=document.createElement('option');t.value='tellicallor';t.textContent='Tellicallor';s.appendChild(t)}if(!s.querySelector('option[value="receptionist"]')){const r=document.createElement('option');r.value='receptionist';r.textContent='Receptionist';s.appendChild(r)}s.querySelectorAll('option').forEach(o=>{if(o.textContent.trim()==='Staff')o.textContent='Executive'})});document.querySelectorAll('form').forEach(f=>{if(f.dataset.nroraRoleHook)return;const s=f.querySelector('select'),u=f.querySelector('input[autocomplete="off"]');if(s&&u){f.dataset.nroraRoleHook='1';f.addEventListener('submit',()=>{const v=s.value;if(v&&u.value)save({[u.value]:labels[v]||v})},{capture:true})}})}new MutationObserver(enhance).observe(document.documentElement,{subtree:true,childList:true,characterData:true});enhance()})();</script><script type="module" src="/src/main.jsx"></script></body></html>
