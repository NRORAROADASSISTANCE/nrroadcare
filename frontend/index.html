<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>NRORA</title></head><body><div id="root"></div><script>(function(){const KEY='nrora_role_labels';const labels={staff:'Executive',tellicallor:'Tellicallor',receptionist:'Receptionist'};const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}};const save=(x)=>localStorage.setItem(KEY,JSON.stringify({...get(),...x}));function enhance(){document.querySelectorAll('select').forEach(s=>{if(!s.querySelector('option[value="tellicallor"]')){const t=document.createElement('option');t.value='tellicallor';t.textContent='Tellicallor';s.appendChild(t)}if(!s.querySelector('option[value="receptionist"]')){const r=document.createElement('option');r.value='receptionist';r.textContent='Receptionist';s.appendChild(r)}s.querySelectorAll('option').forEach(o=>{if(o.textContent.trim()==='Staff')o.textContent='Executive'})});document.querySelectorAll('form').forEach(f=>{if(f.dataset.nroraRoleHook)return;const s=f.querySelector('select'),u=f.querySelector('input[autocomplete="off"]');if(s&&u){f.dataset.nroraRoleHook='1';f.addEventListener('submit',()=>{const v=s.value;if(v&&u.value)save({[u.value]:labels[v]||v})},{capture:true})}});document.querySelectorAll('.card').forEach(c=>{const h=c.querySelector('h2');if(!h||h.textContent.trim()!=='Team List')return;const m=get();c.querySelectorAll('.row').forEach(row=>{const smalls=row.querySelectorAll('small');if(!smalls.length)return;const first=smalls[0],match=first.textContent.match(/^(.*?)\s*·\s*@([^\s]+)/);if(match&&m[match[2]])first.textContent=first.textContent.replace(match[1],m[match[2]])})})}new MutationObserver(enhance).observe(document.documentElement,{subtree:true,childList:true,characterData:true});enhance()})();</script><script type="module" src="/src/main.jsx"></script></body></html>
