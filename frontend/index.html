<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NRORA</title><style>html,body,#root{min-height:100%;margin:0}body{background:#f6f8fb}.login{width:min(420px,calc(100% - 32px));margin:90px auto 0!important;background:#fff;border:1px solid #e3e8f0;border-radius:18px;padding:32px!important;box-shadow:0 12px 40px rgba(23,32,51,.10)}.login h1,.login h2{margin-top:0}.login input{width:100%;padding:12px 13px!important;border:1px solid #d9dee7!important;border-radius:9px!important;font-size:14px!important;outline:none}.login input:focus{border-color:#2457d6!important;box-shadow:0 0 0 3px rgba(36,87,214,.10)}.login button{min-height:44px!important;border-radius:10px!important;font-size:14px!important}.login form{display:grid;gap:12px}.login label{display:grid;gap:6px}.login-page,.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px}</style></head><body><script>if(!location.hash&&location.pathname==='/'){location.replace('/public-site.html#home')}</script><div id="root"></div><script>/* CEO session bridge: if a CEO session exists, it always wins over any stale Admin token. */(function(){const t=localStorage.getItem('nrora_ceo_token');if(t)localStorage.setItem('nrora_token',t)})();</script><script>(function(){const KEY='nrora_role_labels';const labels={staff:'Executive',tellicallor:'Tellicallor',receptionist:'Receptionist'};const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}};const save=(x)=>localStorage.setItem(KEY,JSON.stringify({...get(),...x}));function enhance(){document.querySelectorAll('select').forEach(s=>{if(!s.querySelector('option[value="tellicallor"]')){const t=document.createElement('option');t.value='tellicallor';t.textContent='Tellicallor';s.appendChild(t)}if(!s.querySelector('option[value="receptionist"]')){const r=document.createElement('option');r.value='receptionist';r.textContent='Receptionist';s.appendChild(r)}s.querySelectorAll('option').forEach(o=>{if(o.textContent.trim()==='Staff')o.textContent='Executive'})});document.querySelectorAll('form').forEach(f=>{if(f.dataset.nroraRoleHook)return;const s=f.querySelector('select'),u=f.querySelector('input[autocomplete="off"]');if(s&&u){f.dataset.nroraRoleHook='1';f.addEventListener('submit',()=>{const v=s.value;if(v&&u.value)save({[u.value]:labels[v]||v})},{capture:true})}})}new MutationObserver(enhance).observe(document.documentElement,{subtree:true,childList:true,characterData:true});enhance()})();</script><script type="module" src="/src/main.jsx"></script></body></html>
