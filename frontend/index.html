<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NRORA</title><style>html,body,#root{min-height:100%;margin:0}body{min-width:320px}.nrora-show-password{position:absolute;right:8px;bottom:7px;border:0;background:transparent;color:#2367df;font-weight:800;cursor:pointer;padding:4px 6px;z-index:2}.nrora-password-label{position:relative}</style></head><body><script>/* Public customer self-registration must never fall through to the staff/admin SPA. */(function(){var p=location.pathname.replace(/\/+$/,'')||'/';if(p==='/register'||p==='/customer-register'){location.replace('/customer-register.html'+location.search);return}})();if(!location.hash&&location.pathname==='/'){location.replace('/public-site.html#home')}</script><div id="root"></div><script>/* NRORA persistent login: a normal browser refresh must NOT log out any user. A separate logout marker is used so an intentional Logout still works. */(function(){try{var T='nrora_token',C='nrora_ceo_token',B='nrora_session_backup',L='nrora_logged_out';var t=localStorage.getItem(T)||localStorage.getItem(C);if(t){localStorage.setItem(B,t);localStorage.removeItem(L)}else if(!localStorage.getItem(L)){var b=localStorage.getItem(B);if(b){localStorage.setItem(T,b)}}document.addEventListener('click',function(e){var el=e.target&&e.target.closest?e.target.closest('button'):null;if(el&&/\blogout\b/i.test((el.textContent||'').trim())){localStorage.setItem(L,'1');localStorage.removeItem(B)}},true)}catch(e){}})();</script><script>/* CEO session bridge: if a CEO session exists, it always wins over any stale Admin token. */(function(){const t=localStorage.getItem('nrora_ceo_token');if(t)localStorage.setItem('nrora_token',t)})();</script><script>/* Vercel catch-all API compatibility: explicitly provide the route parameter used by the consolidated API handler. */(function(){try{var originalFetch=window.fetch;var consolidated={'dashboard':1,'customers':1,'requests':1,'employees':1,'technicians':1,'payments':1,'memberships/renew':1,'customer-update-requests':1,'ceo/settings':1};window.fetch=function(input,init){if(typeof input==='string'){try{var u=new URL(input,location.origin);if(u.origin===location.origin&&u.pathname.indexOf('/api/')===0){var p=u.pathname.slice(5);if(consolidated[p]&&!u.searchParams.has('path')){u.searchParams.set('path',p);input=u.pathname+u.search}}}catch(e){}}return originalFetch.call(this,input,init)}}catch(e){}})();</script><script type="module" src="/src/main.jsx"></script></body></html>
