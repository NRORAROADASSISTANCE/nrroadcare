<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA CEO Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#edf3fb;color:#10213e;min-height:100vh;display:flex;flex-direction:column}header{background:#071d3c;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}.logo{width:100px;height:54px}.brand{font-weight:900;font-size:21px}.sub{font-size:11px;color:#c8ddfa;margin-top:4px;letter-spacing:1px}main{flex:1;display:grid;place-items:center;padding:22px}.card{background:#fff;border:1px solid #dce6f4;border-radius:18px;padding:28px;width:min(430px,100%);box-shadow:0 20px 55px #173b6812}h1{margin:0 0 8px}p{color:#667892;font-size:13px;line-height:1.6}label{display:block;font-size:12px;font-weight:800;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd8e9;border-radius:10px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#1677ff;color:white;font-weight:800;margin-top:20px;cursor:pointer}.error{color:#b42318;background:#fff0f0;padding:10px;border-radius:8px;margin-top:12px;font-size:13px}</style></head><body><header><svg class="logo" viewBox="0 0 240 100" role="img" aria-label="NRORA Road Assistance"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#48c5ff"/><stop offset=".6" stop-color="#0877e8"/><stop offset="1" stop-color="#063a91"/></linearGradient></defs><path d="M12 61L30 32Q36 23 49 23H91Q104 24 112 41L129 50L134 63H12Z" fill="url(#b)" stroke="#d8efff" stroke-width="3"/><path d="M44 29H66V46H32ZM72 29H89Q98 30 104 46H72Z" fill="#eaf8ff"/><circle cx="43" cy="62" r="12" fill="#071d3f" stroke="#b9e9ff" stroke-width="4"/><circle cx="106" cy="62" r="12" fill="#071d3f" stroke="#b9e9ff" stroke-width="4"/><text x="137" y="52" font-size="36" font-weight="900" fill="url(#b)" stroke="#eaf5ff" stroke-width="1" paint-order="stroke">NRORA</text><text x="142" y="76" font-size="13" font-weight="900" letter-spacing="2" fill="#eaf5ff">ROAD ASSISTANCE</text></svg><div><div class="brand">CEO LOGIN</div><div class="sub">NRORA ROAD ASSISTANCE</div></div></header><main><section class="card"><h1>CEO Control Centre</h1><p>Sign in with your existing CEO credentials. This page is only for login; the old CEO operations layout has been removed from this page.</p><form id="form"><label for="username">CEO USERNAME</label><input id="username" name="username" value="ceo" autocomplete="username" required><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required><div id="error"></div><button id="submit" type="submit">Sign in to CEO Dashboard</button></form></section></main><script>const form=document.getElementById('form'),errorBox=document.getElementById('error'),btn=document.getElementById('submit');async function go(t){sessionStorage.setItem('nrora_ceo_token',t);sessionStorage.setItem('nrora_token',t);localStorage.removeItem('nrora_ceo_token');localStorage.removeItem('nrora_token');location.replace('/?ceo=1#/')}form.addEventListener('submit',async e=>{e.preventDefault();errorBox.textContent='';errorBox.className='';btn.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Login failed');if(d.user?.role!=='ceo')throw Error('CEO access only');await go(d.token)}catch(e){errorBox.textContent=e.message;errorBox.className='error'}finally{btn.disabled=false}});localStorage.removeItem('nrora_ceo_token');localStorage.removeItem('nrora_token');const t=sessionStorage.getItem('nrora_ceo_token')||sessionStorage.getItem('nrora_token');if(t)fetch('/api/auth/me',{headers:{Authorization:'Bearer '+t}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(d.user?.role==='ceo')go(t)}).catch(()=>{});</script></body></html>
