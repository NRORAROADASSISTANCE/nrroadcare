<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA Customer Registration</title></head><body><main><h1>NRORA Customer Registration</h1><form><label>House / Door No.<input name="houseNo" required></label><label>Landmark<input name="landmark"></label><label>State<input name="state" value="Telangana" readonly></label><label>District<input name="district" list="districts" placeholder="Search / select District" required><datalist id="districts"><option>Adilabad</option><option>Bhadradri Kothagudem</option><option>Hanumakonda</option><option>Hyderabad</option><option>Jagtial</option><option>Jangaon</option><option>Jayashankar Bhupalpally</option><option>Jogulamba Gadwal</option><option>Kamareddy</option><option>Karimnagar</option><option>Khammam</option><option>Kumuram Bheem</option><option>Mahabubabad</option><option>Mahabubnagar</option><option>Mancherial</option><option>Medak</option><option>Medchal-Malkajgiri</option><option>Mulugu</option><option>Nagarkurnool</option><option>Nalgonda</option><option>Narayanpet</option><option>Nirmal</option><option>Nizamabad</option><option>Peddapalli</option><option>Rajanna Sircilla</option><option>Rangareddy</option><option>Sangareddy</option><option>Siddipet</option><option>Suryapet</option><option>Vikarabad</option><option>Wanaparthy</option><option>Warangal</option><option>Yadadri Bhuvanagiri</option></datalist></label><label>Mandal<input name="mandal" placeholder="Search / select Mandal" required></label><label>Village / Town<input name="village" placeholder="Search / select Village / Town" required></label><label>PIN Code<input name="pincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit PIN Code" required></label><button type="submit">Continue</button></form><p>Address hierarchy: Telangana → District → Mandal → Village/Town → PIN.</p></main></body></html>
