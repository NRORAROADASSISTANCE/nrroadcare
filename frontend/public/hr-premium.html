<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA HR Premium</title><style>body{margin:0;font-family:Inter,Arial;background:linear-gradient(135deg,#061225,#0b2d59 55%,#061225);color:#eef6ff}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1468ff,#08c8ff);display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:20px}.brand small{color:#9bb5d2}.pill{padding:9px 14px;border-radius:999px;background:#ffffff0b;border:1px solid #ffffff18;color:#bde9ff}.hero,.card,.stat{background:#ffffff09;border:1px solid #ffffff18;backdrop-filter:blur(18px);box-shadow:0 20px 60px #0005}.hero{padding:28px;border-radius:26px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:34px}.muted{color:#9bb1ca}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{padding:18px;border-radius:18px}.stat small{color:#8fa9c5}.stat strong{display:block;font-size:28px;margin-top:7px}.grid{display:grid;grid-template-columns:390px 1fr;gap:20px}.card{padding:22px;border-radius:22px}.card h2{margin-top:0}.form{display:grid;gap:11px}.form label{font-size:11px;font-weight:800;color:#a5bed9}.form input,.form select{width:100%;box-sizing:border-box;margin-top:6px;padding:13px;border-radius:12px;border:1px solid #ffffff20;background:#061a33;color:#fff}.btn{border:0;border-radius:13px;padding:14px;font-weight:800;color:#fff;background:linear-gradient(90deg,#1268ff,#08c8ff);cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #ffffff12}.row b{display:block}.row small{display:block;color:#8fa9c5;margin-top:4px}.mini{border:1px solid #ffffff18;background:#ffffff0b;color:#dcecff;border-radius:9px;padding:8px 10px;cursor:pointer}.ok{color:#5fe4a4}.bad{color:#ff8997}.error{padding:12px;border-radius:12px;background:#ff4d5d15;color:#ff9ba5;border:1px solid #ff4d5d33}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:14px}.stats{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">NR</div><div><b>NRORA HR</b><small>Human Resources & Employee Management</small></div></div><div class="pill">● HR Operations</div></div><section class="hero"><h1>People & Workforce</h1><p class="muted">Employee master, roles, joining details, appointment letters and workforce status in one premium workspace.</p></section><div class="stats"><div class="stat"><small>Total Employees</small><strong id="total">—</strong></div><div class="stat"><small>Active Employees</small><strong id="active">—</strong></div><div class="stat"><small>Management Roles</small><strong id="managers">—</strong></div></div><div class="grid"><section class="card"><h2>➕ Add Employee</h2><form id="form" class="form"><label>FULL NAME<input name="name" required></label><label>ROLE<select name="role"><option value="staff">Staff</option><option value="tl">TL</option><option value="area_manager">Area Manager</option><option value="division_manager">Division Manager</option></select></label><label>USERNAME<input name="username" required></label><label>PASSWORD<input name="password" required minlength="6" type="password"></label><label>PHONE<input name="phone"></label><label>JOINING DATE<input name="joining_date" type="date"></label><label>DEPARTMENT<input name="department" value="Operations"></label><label>REPORTING MANAGER<input name="manager" value="NRORA Management"></label><label>WORK LOCATION<input name="location" value="NRORA Road Assistance"></label><label>MONTHLY SALARY / CTC<input name="salary" placeholder="Optional"></label><div id="err"></div><button class="btn">Create Employee & Generate Appointment Letter</button></form></section><section class="card"><h2>Team Directory</h2><div id="list" class="muted">Loading...</div></section></div></div><script>const token=localStorage.getItem('nrora_token');const api=async(p,o={})=>{const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(token||'')}});if(!r.ok){let e={};try{e=await r.json()}catch{}throw Error(e.error||'Request failed '+r.status)}return r.status===204?null:r.json()};const labels={division_manager:'Division Manager',area_manager:'Area Manager',tl:'TL',staff:'Staff'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const rows=await api('/employees');document.getElementById('total').textContent=rows.length;document.getElementById('active').textContent=rows.filter(x=>x.active).length;document.getElementById('managers').textContent=rows.filter(x=>['tl','area_manager','division_manager'].includes(x.role)).length;document.getElementById('list').innerHTML=rows.length?rows.map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><small>'+esc(labels[x.role]||x.role)+' · @'+esc(x.username)+'</small><small>'+esc(x.phone||'No phone')+' · <span class="'+(x.active?'ok':'bad')+'">'+(x.active?'Active':'Disabled')+'</span></small></div><div><button class="mini" onclick="toggle('+x.id+','+(!x.active)+')">'+(x.active?'Disable':'Enable')+'</button></div></div>').join(''):'No team members yet.'}catch(e){document.getElementById('list').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();document.getElementById('err').innerHTML='';const d=Object.fromEntries(new FormData(e.target));try{await api('/employees',{method:'POST',body:JSON.stringify({name:d.name,username:d.username,password:d.password,phone:d.phone,role:d.role})});e.target.reset();load()}catch(x){document.getElementById('err').innerHTML='<div class="error">'+esc(x.message)+'</div>'}};async function toggle(id,active){try{await api('/employees/'+id,{method:'PATCH',body:JSON.stringify({active})});load()}catch(e){alert(e.message)}}load();</script></body></html>
