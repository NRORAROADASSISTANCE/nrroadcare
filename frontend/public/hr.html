<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA HR & Salary</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:24px auto;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 18px #0001;margin-bottom:16px}h1,h2{margin-top:0}label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd4df;border-radius:8px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;background:#2857d9;color:white;margin-top:12px}.muted{color:#687386}.row{padding:12px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:12px}.slip{border:1px solid #cbd5e1;padding:24px;background:white}.top{text-align:center;border-bottom:2px solid #172033;padding-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.right{text-align:right}.small{font-size:12px}@media(max-width:760px){.grid,.two{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>NRORA HR & Salary</h1><p class="muted">Employee master, salary processing and monthly salary slips.</p><div class="grid"><div class="card"><h2>Employee Salary</h2><label>EMPLOYEE</label><select id="employee"><option value="">Select employee</option></select><label>SALARY MONTH</label><input id="month" type="month"><label>BASIC</label><input id="basic" type="number" value="0"><label>HRA</label><input id="hra" type="number" value="0"><label>ALLOWANCES</label><input id="allow" type="number" value="0"><label>INCENTIVES</label><input id="incentive" type="number" value="0"><label>OVERTIME</label><input id="overtime" type="number" value="0"><label>PF / ESI / OTHER DEDUCTIONS</label><input id="deduct" type="number" value="0"><button onclick="generate()">Generate Salary Slip</button></div><div class="card"><h2>Employee List</h2><div id="list" class="muted">Loading...</div></div></div><div class="card"><div id="slip" class="slip"><div class="top"><h2>NRORA ROAD ASSISTANCE</h2><div>Salary Slip</div></div><p class="muted">Select an employee and generate the monthly salary slip.</p></div><button onclick="window.print()">Print / Save PDF</button></div></div><script>const token=localStorage.getItem('nrora_token');const api=(u,o={})=>fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x});let employees=[];function money(n){return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}async function load(){try{employees=await api('/employees');const s=document.getElementById('employee');employees.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name+' — '+e.role+' (@'+e.username+')';s.appendChild(o)});document.getElementById('list').innerHTML=employees.length?employees.map(e=>'<div class="row"><div><b>'+e.name+'</b><br><span class="small">'+e.role+' · '+(e.phone||'No phone')+'</span></div><span>'+(e.active?'Active':'Disabled')+'</span></div>').join(''):'No employees found.'}catch(e){document.getElementById('list').textContent=e.message}}function generate(){const e=employees.find(x=>String(x.id)===document.getElementById('employee').value);if(!e){alert('Select employee');return}const month=document.getElementById('month').value||new Date().toISOString().slice(0,7);const basic=+document.getElementById('basic').value||0,hra=+document.getElementById('hra').value||0,allow=+document.getElementById('allow').value||0,inc=+document.getElementById('incentive').value||0,ot=+document.getElementById('overtime').value||0,ded=+document.getElementById('deduct').value||0,gross=basic+hra+allow+inc+ot,net=gross-ded;document.getElementById('slip').innerHTML='<div class="top"><h2>NRORA ROAD ASSISTANCE</h2><div>Salary Slip — '+month+'</div></div><div class="two"><div><b>Employee</b><br>'+e.name+'</div><div class="right"><b>Employee ID</b><br>NR-'+String(e.id).padStart(5,'0')+'</div><div><b>Designation</b><br>'+e.role+'</div><div class="right"><b>Phone</b><br>'+(e.phone||'—')+'</div></div><hr><div class="two"><div>Basic Salary<br><b>₹'+money(basic)+'</b></div><div>HRA<br><b>₹'+money(hra)+'</b></div><div>Allowances<br><b>₹'+money(allow)+'</b></div><div>Incentives<br><b>₹'+money(inc)+'</b></div><div>Overtime<br><b>₹'+money(ot)+'</b></div><div>Deductions<br><b>₹'+money(ded)+'</b></div></div><hr><div class="right"><div>Gross Salary: <b>₹'+money(gross)+'</b></div><h2>Net Pay: ₹'+money(net)+'</h2></div><p class="small muted">Generated by NRORA HR. Statutory deductions are based on the values entered by HR.</p><p>Authorized Signatory: __________________</p>'}document.getElementById('month').value=new Date().toISOString().slice(0,7);load();</script></body></html>
