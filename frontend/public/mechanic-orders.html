<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA Mechanic Orders</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f7fc;color:#0b2344}.wrap{max-width:980px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #dce5f1;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(16,48,88,.08);margin-bottom:16px}h1{margin:0 0 6px}h2{margin-top:0}.muted{color:#63758d}.grid{display:grid;gap:14px}.order{border:1px solid #dbe5f0;border-radius:14px;padding:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#e9f1ff;font-size:12px;font-weight:700}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#1857d8;color:white;margin:4px}.btn.secondary{background:#123d70}.btn.danger{background:#b42318}.input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd8e8;border-radius:10px;margin:6px 0 12px}.error{background:#fff0f0;color:#b42318;padding:10px;border-radius:10px}.success{background:#ecfdf3;color:#087443;padding:10px;border-radius:10px}@media(max-width:600px){.wrap{padding:12px}.card{padding:15px}}</style></head><body><div class="wrap"><div id="login" class="card"><h1>NRORA Mechanic Login</h1><p class="muted">Sign in with the mechanic username and password created by NRORA Admin.</p><form id="loginForm"><label>Username<input class="input" id="username" required autocomplete="username"></label><label>Password<input class="input" id="password" type="password" required autocomplete="current-password"></label><button class="btn">Login</button></form><p id="loginError" class="error" hidden></p></div><div id="app" hidden><div class="card row"><div><h1>Mechanic Orders</h1><p id="who" class="muted"></p></div><button id="logout" class="btn danger">Logout</button></div><div id="message"></div><div id="orders" class="grid"></div></div></div><script>const api=async(path,opts={})=>{const token=localStorage.getItem('nrora_token');const headers={...(opts.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch('/api'+path,{...opts,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed ('+r.status+')');return d};const $=id=>document.getElementById(id);function showApp(){const u=JSON.parse(localStorage.getItem('nrora_mechanic_user')||'null');if(!localStorage.getItem('nrora_token')||!u||u.role!=='mechanic')return;$('login').hidden=true;$('app').hidden=false;$('who').textContent='Logged in as '+u.name+' · '+u.username;load()}async function login(e){e.preventDefault();$('loginError').hidden=true;try{const r=await api('/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});if(r.user.role!=='mechanic')throw new Error('This login is not a mechanic account.');localStorage.setItem('nrora_token',r.token);localStorage.setItem('nrora_mechanic_user',JSON.stringify(r.user));showApp()}catch(e){$('loginError').textContent=e.message;$('loginError').hidden=false}}async function load(){try{const rows=await api('/mechanic-orders');render(rows)}catch(e){$('message').innerHTML='<p class="error">'+e.message+'</p>'}}function render(rows){$('message').innerHTML=rows.some(x=>x.status==='sent')?'<p class="success">New order received. Please accept it.</p>':'';$('orders').innerHTML=rows.length?rows.map(o=>{const next=o.status==='sent'?'<button class="btn" onclick="setStatus('+o.id+',\'accepted\')">Accept Order</button>':o.status==='accepted'?'<button class="btn" onclick="setStatus('+o.id+',\'on_the_way\')">On the Way</button>':o.status==='on_the_way'?'<button class="btn" onclick="setStatus('+o.id+',\'reached\')">Reached</button>':o.status==='reached'?'<button class="btn" onclick="setStatus('+o.id+',\'service_started\')">Start Service</button>':o.status==='service_started'?'<button class="btn" onclick="setStatus('+o.id+',\'completed\')">Complete Service</button>':'<span class="pill">Completed</span>';return '<div class="order"><div class="row"><div><h2>Order #'+o.request_id+'</h2><div class="pill">'+o.status.replaceAll('_',' ').toUpperCase()+'</div></div><div>'+next+'</div></div><hr><p><b>Customer:</b> '+(o.customer_name||'—')+'</p><p><b>Mobile:</b> '+(o.customer_phone||'—')+'</p><p><b>Vehicle:</b> '+(o.vehicle_no||'—')+'</p><p><b>Problem:</b> '+(o.description||'—')+'</p><p><b>Location:</b> '+(o.location||'—')+'</p><p class="muted">Order received: '+new Date(o.created_at).toLocaleString('en-IN')+'</p></div>'}).join(''):'<div class="card"><h2>No orders</h2><p class="muted">Assigned roadside assistance orders will appear here.</p></div>'}async function setStatus(id,status){try{await api('/mechanic-orders?id='+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});await load()}catch(e){$('message').innerHTML='<p class="error">'+e.message+'</p>'}}$('loginForm').addEventListener('submit',login);$('logout').addEventListener('click',()=>{localStorage.removeItem('nrora_token');localStorage.removeItem('nrora_mechanic_user');location.reload()});showApp();setInterval(()=>{if(!$('app').hidden)load()},10000);</script></body></html>
