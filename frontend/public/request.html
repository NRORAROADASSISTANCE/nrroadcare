<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Road Assistance | NRORA</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#12213a}.wrap{max-width:760px;margin:0 auto;padding:22px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:12px;background:#123b69;color:#fff;display:grid;place-items:center;font-weight:800}.brand b{font-size:22px}.brand small{display:block;color:#66758a;margin-top:3px}.card{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 25px rgba(18,33,58,.06)}h1{font-size:26px;margin:0 0 7px}h2{font-size:19px;margin:0 0 14px}p{color:#66758a;line-height:1.5}label{display:block;font-size:12px;font-weight:800;color:#526276;margin:13px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cfd9e6;border-radius:10px;font-size:15px;background:#fff}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:#123b69;color:#fff;width:100%;margin-top:14px}.secondary{background:#eef3f8;color:#123b69}.loc{display:flex;gap:8px;margin-top:8px}.loc button{white-space:nowrap}.msg{margin-top:12px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#e9f8ef;color:#11643b}.err{display:block;background:#fff0f0;color:#a52b2b}.result{font-size:18px;font-weight:800;color:#123b69}.status{display:inline-block;padding:7px 10px;border-radius:20px;background:#eef3f8;font-weight:800}.muted{font-size:13px}@media(max-width:560px){.row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="brand"><div class="logo">NR</div><div><b>NRORA</b><small>Road Assistance</small></div></div><div class="card"><h1>Request Road Assistance</h1><p>Vehicle breakdown? Send your request to NRORA. Our team will receive it and assign a mechanic.</p><form id="form"><div class="row"><div><label>YOUR NAME</label><input id="name" required></div><div><label>MOBILE NUMBER</label><input id="phone" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required placeholder="10-digit mobile"></div></div><label>VEHICLE NUMBER</label><input id="vehicle" required placeholder="TS00AB0000"><label>WHAT IS THE PROBLEM?</label><textarea id="description" required placeholder="Example: Car not starting / puncture / battery problem"></textarea><label>YOUR LOCATION</label><div class="loc"><input id="location" placeholder="Current location or landmark"><button type="button" class="btn secondary" id="locBtn">Use GPS</button></div><label>VEHICLE / BREAKDOWN PHOTO (OPTIONAL)</label><input id="photo" type="file" accept="image/*" capture="environment"><button class="btn primary" id="submit">Send Assistance Request</button><div id="msg" class="msg"></div></form></div><div class="card"><h2>Track Your Request</h2><p class="muted">Enter the Request ID you received after submitting.</p><div class="row"><div><label>REQUEST ID</label><input id="trackId" placeholder="Example: 123"></div><div><label>MOBILE NUMBER</label><input id="trackPhone" inputmode="numeric" maxlength="10"></div></div><button class="btn primary" id="track">Check Status</button><div id="trackMsg" class="msg"></div></div></div><script>const $=id=>document.getElementById(id);let photoData="";$('photo').onchange=()=>{const f=$('photo').files?.[0];if(!f){photoData="";return}const r=new FileReader();r.onload=()=>{photoData=String(r.result||'')};r.readAsDataURL(f)};$('locBtn').onclick=()=>{if(!navigator.geolocation){$('location').value='GPS not available';return}navigator.geolocation.getCurrentPosition(p=>{$('location').value=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`},()=>alert('Please allow location access or enter a landmark manually'))};$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;b.textContent='Sending Request…';$('msg').className='msg';try{const r=await fetch('/api/customer-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),phone:$('phone').value.trim(),vehicle_no:$('vehicle').value.trim().toUpperCase(),description:$('description').value.trim(),location:$('location').value.trim(),photo_data:photoData})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to send request');$('msg').className='msg ok';$('msg').innerHTML=`Request sent successfully. Your Request ID is <span class="result">#${d.requestId}</span>. Please keep this number.`;$('trackId').value=d.requestId;$('trackPhone').value=$('phone').value.trim();$('form').reset();photoData=""}catch(x){$('msg').className='msg err';$('msg').textContent=x.message}finally{b.disabled=false;b.textContent='Send Assistance Request'}};$('track').onclick=async()=>{const m=$('trackMsg');m.className='msg';try{const r=await fetch(`/api/customer-request?id=${encodeURIComponent($('trackId').value.trim())}&phone=${encodeURIComponent($('trackPhone').value.trim())}`);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request not found');m.className='msg ok';m.innerHTML=`Status: <span class="status">${d.status.replaceAll('_',' ')}</span>${d.assigned_technician?`<br><br>Mechanic: <b>${d.assigned_technician}</b>`:''}`}catch(x){m.className='msg err';m.textContent=x.message}};</script></body></html>
