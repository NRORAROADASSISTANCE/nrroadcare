<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA Customer Registration</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#eef3f9;color:#10233f}.wrap{max-width:720px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 35px #10233f22}h1{margin:0 0 8px}.muted{color:#63748b}label{display:block;font-weight:700;margin:16px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd6e3;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#f47b20;color:#fff;width:100%;margin-top:20px}.status{margin-top:18px;padding:14px;border-radius:10px;background:#f2f6fb}.success{background:#e8f8ef;color:#146c43}.error{background:#fff0f0;color:#a21d1d}.logo{font-weight:900;font-size:30px}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><div class="logo">NRORA</div><h1>Customer Self Registration</h1><p class="muted">Register for NRORA Road Assistance membership. Annual membership: ₹4,500.</p><form id="f"><label>Full Name</label><input id="name" required><label>Mobile Number</label><input id="phone" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}"><label>Address</label><textarea id="address" rows="3"></textarea><label>Vehicle Number</label><input id="vehicle" required><label>Vehicle Photo 1</label><input id="photo1" type="file" accept="image/*"><label>Vehicle Photo 2</label><input id="photo2" type="file" accept="image/*"><button class="primary" id="pay">Register & Pay ₹4,500</button></form><div id="status" class="status hidden"></div></div></div><script>const $=id=>document.getElementById(id), status=(t,c='')=>{const s=$('status');s.className='status '+c;s.classList.remove('hidden');s.textContent=t};const photo=f=>new Promise((res,rej)=>{if(!f)return res('');const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});async function api(action,body){const r=await fetch('/api/customer-register?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function check(orderId){const r=await fetch('/api/customer-register?action=status&order_id='+encodeURIComponent(orderId));return r.json()}$('f').onsubmit=async e=>{e.preventDefault();$('pay').disabled=true;try{status('Creating secure payment order…');const data={name:$('name').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),vehicle_no:$('vehicle').value.trim().toUpperCase(),vehicle_photos:[await photo($('photo1').files[0]),await photo($('photo2').files[0])].filter(Boolean)};const o=await api('register',data);const rzp=new Razorpay({key:o.keyId,amount:o.amount,currency:o.currency,name:'NRORA Road Assistance',description:'Yearly Membership',order_id:o.orderId,handler:async resp=>{try{await api('verify',resp);status('Payment received. Bank/gateway verification is in progress. Please wait 10 minutes…');let n=0;const timer=setInterval(async()=>{n++;try{const x=await check(o.orderId);if(x.status==='active'){clearInterval(timer);status('Payment confirmed. Customer account is ACTIVE. Receipt: '+x.receiptNo,'success')}else if(n>=12){clearInterval(timer);status('Verification is still in progress. Please check again after some time.')}}catch{}},50000)}catch(err){status(err.message,'error')}},modal:{ondismiss:()=>{$('pay').disabled=false;status('Payment window closed. You can try again.')}}});rzp.open()}catch(err){status(err.message,'error');$('pay').disabled=false}};</script></body></html>
