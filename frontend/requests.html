<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRORA Incoming Requests</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#09224d}.wrap{max-width:1100px;margin:0 auto;padding:28px}.head{margin-bottom:20px}.head h1{margin:0 0 6px;font-size:30px}.muted{color:#61708a}.card{background:#fff;border:1px solid #dbe4f0;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(20,45,80,.06)}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf1ff;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.item b{display:block;font-size:12px;color:#6b7890;margin-bottom:3px}.item span{font-size:15px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}select,button{border:1px solid #ccd8e8;border-radius:9px;padding:10px 12px;font-size:14px;background:#fff}button{background:#1769e0;color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#e9eef7;color:#17335c}.error{background:#fff0f0;color:#c62828;padding:12px;border-radius:9px;margin:12px 0}.empty{text-align:center;padding:50px}.refresh{float:right}@media(max-width:700px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.head h1{font-size:24px}}</style></head><body><div class="wrap"><div class="head"><button class="refresh" onclick="load()">Refresh</button><h1>Incoming Service Requests</h1><div class="muted">Customer requests received by NRORA. Admin, Receptionist/Staff and Telecaller can assign a mechanic.</div></div><div id="msg"></div><div id="list"></div></div><script>const token=localStorage.getItem('nrora_token');const user=(()=>{try{const p=token?.split('.')[0];return p?JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))):null}catch{return null}})();const canAssign=['admin','staff','telecaller'].includes(user?.role);const api=async(p,o={})=>{const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed ('+r.status+')');return d};async function load(){const list=document.getElementById('list'),msg=document.getElementById('msg');msg.innerHTML='';list.innerHTML='<div class="card empty">Loading requests…</div>';try{const [rows,techs]=await Promise.all([api('/requests'),api('/technicians')]);if(!rows.length){list.innerHTML='<div class="card empty"><h2>No incoming requests</h2><div class="muted">New customer requests will appear here.</div></div>';return}list.innerHTML=rows.map(r=>{const options=(techs||[]).map(t=>{const name=t.name||t.username||t.full_name||t.id;return '<option value="'+String(name).replace(/"/g,'&quot;')+'" '+(String(name)===String(r.assigned_technician||'')?'selected':'')+'>'+String(name).replace(/</g,'&lt;')+'</option>'}).join('');return '<div class="card"><div class="top"><div><h2 style="margin:0 0 5px">Request #'+r.id+'</h2><div class="muted">'+new Date(r.created_at).toLocaleString()+'</div></div><span class="badge">'+(r.status||'pending').replace('_',' ').toUpperCase()+'</span></div><div class="grid"><div class="item"><b>CUSTOMER</b><span>'+esc(r.customer_name||'Unknown')+'</span></div><div class="item"><b>MOBILE</b><span>'+esc(r.customer_phone||'—')+'</span></div><div class="item"><b>VEHICLE</b><span>'+esc(r.vehicle_no||'—')+'</span></div><div class="item"><b>LOCATION</b><span>'+esc(r.location||'—')+'</span></div><div class="item" style="grid-column:1/-1"><b>PROBLEM</b><span>'+esc(r.description||'—')+'</span></div></div><div class="actions">'+(canAssign?'<select id="tech-'+r.id+'"><option value="">Select Mechanic</option>'+options+'</select><button onclick="assign('+r.id+')">Assign Mechanic</button>':'<span class="muted">Mechanic assignment is managed by Admin / Staff / Telecaller.</span>')+'<select id="status-'+r.id+'" onchange="statusUpdate('+r.id+',this.value)"><option value="pending" '+(r.status==='pending'?'selected':'')+'>Pending</option><option value="assigned" '+(r.status==='assigned'?'selected':'')+'>Assigned</option><option value="on_the_way" '+(r.status==='on_the_way'?'selected':'')+'>On the Way</option><option value="completed" '+(r.status==='completed'?'selected':'')+'>Completed</option><option value="closed" '+(r.status==='closed'?'selected':'')+'>Closed</option></select></div></div>'}).join('')}catch(e){list.innerHTML='';msg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function assign(id){const v=document.getElementById('tech-'+id).value;if(!v)return alert('Select a mechanic first.');try{await api('/requests?id='+id,{method:'PATCH',body:JSON.stringify({assigned_technician:v,status:'assigned'})});load()}catch(e){alert(e.message)}}async function statusUpdate(id,status){try{await api('/requests?id='+id,{method:'PATCH',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}if(!token){location.href='/login'}else load();</script></body></html>
